name: CI

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      # Unit tests do not launch Electron; avoid its binary download here.
      - run: npm ci --ignore-scripts
      - run: npm test

  frontend:
    name: Frontend (types, behavioral tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (regressions and contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolate test configuration, library and engine
        run: |
          printf '%s\n' \
            "REMIQORA_CONFIG=$RUNNER_TEMP/remiqora-test-config.json" \
            "REMIQORA_DATA_DIR=$RUNNER_TEMP/remiqora-test-library" \
            "SEED_VC_DIR=$RUNNER_TEMP/remiqora-test-seed-vc" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r backend/requirements-test.txt
      - run: python backend/scripts/generate_contracts.py --check
      - name: Strict Python types (Linux, macOS, Windows)
        run: |
          for remiqora_type_platform in linux darwin win32; do
            python -m mypy --strict --follow-imports=silent app/contracts.py app/client_contracts.py app/atomic_files.py app/data_root.py app/ace_jobs.py app/audio_version_contracts.py app/audio_version_store.py app/audio_versions.py app/audio_encoding.py app/audio_exports.py app/api/routes_audio_versions.py app/api/routes_audio_exports.py app/api/routes_audio_settings.py app/job_lifecycle.py app/resource_admission.py app/track_view.py app/voice_contracts.py app/voice_progress.py app/voice_comparisons.py app/voice_separation.py app/voice_artifacts.py app/voice_preparation.py app/voice_coverage.py app/prep_vocal.py app/clean_vocal.py app/seed_vc_compat.py app/voice_measure.py app/voice_download.py app/voice_replacement.py app/video_contracts.py app/video_projects.py app/video_media.py app/video_process.py app/video_render.py app/video_text.py app/video_io.py app/video_engine.py app/video_analysis.py app/api/routes_voice_trials.py scripts/generate_contracts.py scripts/setup_roformer.py scripts/setup_video.py scripts/run_video.py --platform "$remiqora_type_platform"
          done
        working-directory: backend
      - run: python -m unittest discover -s app -p '*_test.py' -v
        working-directory: backend
